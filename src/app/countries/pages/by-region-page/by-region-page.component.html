<h2>Por Región</h2>
<hr>
<div class="row">
    <div class="col">
        <!-- SearchBox -->
         <button *ngFor="let region of regions" class="btn mx-2" [ngClass]="{'btn-outline-primary': seleccionado == region}" (click) ="searchByRegion(region)">
            {{region}}
         </button>
    </div>
</div>

<div class="row">
    <div class="col">
        <hr>
        <!-- tabla de resultados -->
        <countries-table [countries]="countries"></countries-table>
    </div>
</div>
